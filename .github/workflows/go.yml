name: go

# Run on every PR / push to main that touches `go/` files or this
# workflow. Keeps CI scoped — a pure-Python change doesn't trigger
# a Go matrix run, and vice-versa for the existing `test.yml` /
# `ts.yml` workflows.

on:
  push:
    branches: [main]
    paths:
      - "go/**"
      - "tests/protocol/**"
      - ".github/workflows/go.yml"
  pull_request:
    paths:
      - "go/**"
      - "tests/protocol/**"
      - ".github/workflows/go.yml"

# Defense-in-depth: this workflow only reads the repo and reports
# back via the default check-run mechanism. No write permissions.
permissions:
  contents: read

jobs:
  test:
    name: go (${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.22 is the minimum declared in go.mod. 1.23 catches
        # newer-Go regressions before they bite a downstream user.
        # Bump alongside go.mod when raising the floor.
        go-version: ["1.22", "1.23"]
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: go/go.sum

      - name: Verify go.mod is tidy
        # `go mod tidy` is idempotent — if running it produces a
        # diff, the committed go.mod / go.sum is out of date.
        # Step 1 ships no third-party deps so go.sum doesn't
        # exist yet; the conditional avoids a "file not found"
        # error until step 3 adds the pgx + lib/pq deps.
        run: |
          go mod tidy
          if [ -f go.sum ]; then
            git diff --exit-code go.mod go.sum
          else
            git diff --exit-code go.mod
          fi

      - name: gofmt
        # Running gofmt in CI gates formatting regressions. Local
        # `go fmt ./...` (or `gofmt -w .`) produces the same result.
        run: |
          fmt_diff=$(gofmt -l .)
          if [ -n "$fmt_diff" ]; then
            echo "gofmt found unformatted files:"
            echo "$fmt_diff"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test (with race detector)
        # `-race` catches the kind of concurrency bug the TS port's
        # postgres.js adapter had (cached promise overwriting a
        # newer reservation). The Go race detector is the standard
        # tool for that class of bug.
        #
        # The v0.7.5 conformance suite (`conformance_test.go`)
        # uses testcontainers-go to spin up a real Postgres
        # container; the GitHub-hosted Linux runners have Docker
        # so the conformance tests run automatically. Local devs
        # without Docker get a graceful skip (when testcontainer
        # init fails, both `TestConformance_*` parent tests call
        # `t.Skip` on entry; the 13 subtests nested under them
        # are never reached).
        run: go test -race -v ./...

  lint:
    name: golangci-lint
    # Lint runs once (not per-Go-version) since the lint config
    # is version-agnostic — checking it against 2 Gos doubles
    # CI minutes without catching new bugs. Picks the
    # `go-version` declared in go.mod via setup-go's
    # `go-version-file: go/go.mod` directive (see step below).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: golangci-lint
        # Pinned to action v6 + linter v1.62.2 — the last v1.x
        # release of the linter, matching the v1-schema config
        # at `go/.golangci.yml`. When bumping to v2.x, both
        # this version and the config file need to migrate.
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62.2
          working-directory: go
          # `--config` is implicit (golangci-lint picks up
          # .golangci.yml in working-directory); --verbose helps
          # when triaging a failure in CI logs.
          args: --timeout=5m --verbose

  vuln:
    name: govulncheck
    # govulncheck scans the module's import graph against
    # https://pkg.go.dev/vuln/ — catches known-CVE'd transitive
    # deps before they ship. Runs once (matching the lint job's
    # rationale — vuln DB is version-agnostic).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        # Pin to the current latest stable Go (1.25) rather
        # than `go-version-file: go/go.mod`. Rationale:
        # govulncheck scans the *runner's* stdlib alongside
        # the module's deps, and any Go release line older
        # than the latest stable accrues patched-in-newer-
        # releases stdlib CVEs that aren't bugs in this
        # module's code — they're bugs in the Go release line
        # itself, fixed by upgrading Go. The test job above
        # already exercises the module against 1.22 and 1.23
        # to catch compatibility issues; govulncheck only
        # needs to gate against vulnerable *deps*, so picking
        # the latest stable Go for this job alone minimizes
        # stdlib-CVE false positives that block CI without
        # giving us code to actually fix.
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: go/go.sum

      - name: Install govulncheck
        # Use the latest govulncheck — its install toolchain
        # requirement (Go 1.25+) matches the runner pin above.
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        # Default behavior: exit non-zero if any vuln applies to
        # imported symbols (vs. just present in go.sum). That
        # filtering is what makes govulncheck practical — it
        # only fails CI on vulns the code actually reaches.
        run: govulncheck ./...
