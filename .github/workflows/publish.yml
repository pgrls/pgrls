name: publish

# Publishes the pgrls Python package to PyPI via PyPI Trusted Publishing
# (OIDC) — no API token is stored in the repo. Fires when a GitHub
# release is published (the normal release flow) and can be run manually
# against the default branch via workflow_dispatch (used to publish a
# release whose tag already exists).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build and check distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Mint the short-lived OIDC token PyPI verifies for Trusted
      # Publishing. This is the only elevated permission needed; no
      # PYPI_API_TOKEN secret is involved.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
