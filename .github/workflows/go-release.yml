name: go-release

# Release plumbing for `pgrls-test-go`.
#
# Go modules don't have a publish registry the way npm or PyPI do
# — `go get` resolves against the module proxy
# (https://proxy.golang.org), which caches what it sees on the
# upstream VCS. The proxy fetches lazily on first download, so a
# fresh tag is "published" as soon as someone runs
# `go get github.com/pgrls/pgrls/go@<tag>`.
#
# This workflow has four sequenced jobs on `go/v*` tag push:
#
#   1. `verify` — re-runs the PR-branch gates against the tag's
#      commit (`tidy + gofmt + vet + race tests +
#      golangci-lint`) plus a cross-check that the tag version
#      has a matching `## [X.Y.Z]` stanza in `go/CHANGELOG.md`.
#      A tag pointing at a broken commit is exactly the case
#      Go's "immutable module versions" semantics make hard to
#      recall.
#   2. `vuln` — runs `govulncheck` against the tag's import
#      graph. Split from `verify` so the failure profile stays
#      legible per-job in the workflow run summary.
#   3. `warm-proxy` — issues a synthetic `go list -m` against
#      the tag, so the public Go module proxy fetches +
#      caches before downstream users hit it cold (one ~10s
#      latency vs. several over the first hour after release).
#   4. `release` — cuts a GitHub Release with the changelog
#      stanza for the tagged version, so the release page
#      becomes the canonical reference for what shipped.
#
# Tag convention: `go/v0.7.6`, `go/v0.8.0`, etc. (the
# `go/`-prefixed module-versioning Go expects for a
# subdirectory module). Distinct from `v0.5.x` (Python) and
# `ts-v0.6.x` (TypeScript) tags so the three release tracks
# don't collide.
#
# Manual cut from a maintainer's laptop also works (push the
# tag, then `gh release create`); this workflow is the CI
# version that ensures the gate ran clean.

on:
  push:
    tags:
      - "go/v*"
  # Allow manual dispatch — useful if a tag is pushed before
  # this workflow exists, or to re-run after a hiccup. The
  # `tag` input should be the tag name (e.g. `go/v0.7.6`).
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. go/v0.7.6)"
        required: true
        type: string

# Defense-in-depth: this workflow writes a GitHub Release
# (contents: write) and reads the rest of the repo. No npm/JSR
# token equivalent for Go — the proxy refresh is unauthenticated.
permissions:
  contents: write

jobs:
  verify:
    name: Verify tag commit passes gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
        with:
          # On tag push, GITHUB_REF is the tag; the default
          # checkout fetches that tagged commit. For manual
          # dispatch, the `tag` input overrides.
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Verify go.mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: gofmt
        run: |
          fmt_diff=$(gofmt -l .)
          if [ -n "$fmt_diff" ]; then
            echo "gofmt found unformatted files:"
            echo "$fmt_diff"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test (with race detector)
        # The PR workflow runs with `-v` for log-readability;
        # the release workflow keeps the run terse since the
        # release-noise channel is the GitHub Release body,
        # not the workflow logs.
        run: go test -race ./...

      - name: golangci-lint
        # Re-run the lint gate against the tag commit. Same
        # version + config as the PR workflow's lint job;
        # `--verbose` is intentionally dropped here since the
        # release-noise channel is the GitHub Release body,
        # not the workflow logs (verbose only helps when
        # triaging a failure, which is the PR-workflow's job).
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: go
          args: --timeout=5m

      - name: Verify tag matches CHANGELOG
        # Cross-check that the tag's version (`go/v0.7.6`) has
        # a matching `## [0.7.6]` entry in `go/CHANGELOG.md`.
        # A mismatch (missing entry, typo'd version) is a
        # release-process bug worth blocking on. Tag is
        # routed through `env:` so the workflow stays safe
        # against shell metacharacters in user-controlled
        # `workflow_dispatch.inputs.tag`.
        env:
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          # `github.ref_name` for `go/v0.7.6` push is literally
          # `go/v0.7.6`; strip the `go/v` prefix.
          VERSION="${TAG_NAME#go/v}"
          # Use a literal-prefix match (not a regex) so version
          # dots aren't interpreted as wildcards. `grep -F`
          # would also work; awk's `index()` keeps the script
          # self-contained.
          if ! awk -v v="$VERSION" 'BEGIN{ok=1} {if (index($0, "## [" v "]") == 1) {ok=0; exit}} END{exit ok}' CHANGELOG.md; then
            echo "::error::No '## [$VERSION]' entry in go/CHANGELOG.md"
            exit 1
          fi
          echo "go/CHANGELOG.md entry for v$VERSION present"

  vuln:
    name: govulncheck against tag commit
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Go
        # See the rationale in `go.yml`'s vuln job: pin to the
        # current latest stable Go (1.25) so the runner's
        # stdlib doesn't surface unpatched-in-older-line CVEs
        # that aren't bugs in this module's code.
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: go/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  warm-proxy:
    name: Warm the Go module proxy
    needs: [verify, vuln]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Newest of the test matrix — `go list -m` doesn't
          # care about the module's `go` directive (it just
          # asks the proxy for a tag), but using a current
          # toolchain avoids surprise interactions with the
          # public proxy's cache headers.
          go-version: "1.23"
          cache-dependency-path: go/go.sum

      - name: Force proxy cache via go list -m
        # `go list -m github.com/pgrls/pgrls/go@<tag>` causes
        # the configured GOPROXY (default
        # `https://proxy.golang.org`) to fetch and cache the
        # tag. After this step succeeds, downstream
        # `go get ...@<tag>` is served from the proxy cache
        # without a cold round-trip to GitHub. Tag routed via
        # env so workflow_dispatch input is shell-safe.
        env:
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="${TAG_NAME#go/}"
          echo "Warming proxy for github.com/pgrls/pgrls/go@$VERSION"
          # GOPROXY defaults to https://proxy.golang.org,direct.
          # The list -m call forces fetch from the configured
          # proxy chain.
          go list -m -json "github.com/pgrls/pgrls/go@$VERSION"

  release:
    name: Cut GitHub Release
    needs: [verify, vuln, warm-proxy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Extract release notes from CHANGELOG
        # Pluck the version's stanza from go/CHANGELOG.md
        # (between this version's `## [X.Y.Z]` heading and the
        # next `## ` heading) and write it to a file. The
        # subsequent step feeds the file to `gh release
        # create --notes-file` rather than splicing the
        # multi-line content into the `gh` shell command —
        # CHANGELOG bodies contain backticks (`go list -m`,
        # `errcheck`, etc.), and a literal interpolation into
        # a double-quoted shell argument would let bash treat
        # those as command-substitution boundaries.
        env:
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="${TAG_NAME#go/v}"
          # awk script with literal-prefix matching via
          # `index()` so version dots aren't interpreted as
          # regex wildcards. `next` skips the heading line so
          # the file starts with the stanza body.
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { in_block=1; next }
            in_block && /^## / { exit }
            in_block { print }
          ' go/CHANGELOG.md \
            | sed -e :a -e '/^[[:space:]]*$/{$d;N;ba' -e '}' \
            > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No release notes extracted for v$VERSION from go/CHANGELOG.md"
            exit 1
          fi
          echo "Extracted $(wc -l < release-notes.md) lines of release notes"

      - name: Create GitHub Release
        # `gh release create` errors when a Release already
        # exists for the tag — the inline `gh release view`
        # check at the top of this script makes the call
        # idempotent across re-runs of this workflow (e.g.
        # the `workflow_dispatch` retry path).
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="${TAG_NAME#go/v}"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists; skipping create (re-run / dispatch retry)"
            exit 0
          fi
          # `--verify-tag` makes gh fail-fast with a clear
          # error if the tag doesn't exist on the remote (e.g.
          # a typo'd workflow_dispatch input). `--notes-file`
          # routes the backtick-bearing CHANGELOG content
          # through a file, not the shell — see the
          # extraction step's comment.
          gh release create "$TAG_NAME" \
            --title "pgrls-test-go v$VERSION" \
            --notes-file release-notes.md \
            --verify-tag
