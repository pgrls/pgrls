name: tests

on:
  push:
    branches: [main, "release/**"]
  pull_request:

# Defense-in-depth: this workflow only runs pytest, so the
# GITHUB_TOKEN has no need for write permissions. Without an
# explicit block the token inherits the repo's default permission
# set, which on most repos includes write access to contents,
# issues, PRs, etc. — a malicious dependency in `pglast` /
# `testcontainers` (both pulled from PyPI in CI) could exfiltrate
# the token to push commits or open issues. `contents: read` is
# the least privilege for "checkout the repo and run tests".
permissions:
  contents: read

jobs:
  pytest:
    name: "pytest pg${{ matrix.pg }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor (15) plus every still-supported major. Keep this
        # in sync with README.md's stated PG floor and with
        # tests/test_pg_version_floor.py::_README_PG_FLOOR_NUM.
        pg: ["15", "16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Skip the testcontainer in conftest.py — CI provides
      # Postgres as a service. Conftest's `pg_conn` still resets
      # schemas between tests against this connection.
      PGRLS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # Tests that DO spawn a testcontainer (e.g. the v0.5+
      # `Schema.to_sql` round-trip soundness pin) must use the
      # same major as the service container; PG17 introduced the
      # `MAINTAIN` grant privilege which earlier majors reject as
      # unrecognized syntax. Without this, capturing under PG17
      # then restoring to a hardcoded PG16 target reproduces the
      # bug `tests/test_schema_to_sql.py::test_to_sql_round_trips_through_real_postgres`
      # caught in CI on PR #18.
      PGRLS_TEST_PG_IMAGE: postgres:${{ matrix.pg }}-alpine
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run unit tests
        run: uv run pytest tests/ -q

      - name: Run demo tests
        run: uv run pytest demo/ -q
