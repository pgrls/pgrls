# Copy this file to `pgrls.toml` and adjust.
# Environment variables can be referenced as `$VAR` or `${VAR}`.

[database]
url = "$DATABASE_URL"
schemas = ["public"]

[lint]
# Rule IDs to skip entirely. Case-insensitive — `["sec001"]` and
# `["SEC001"]` are equivalent; canonical form is uppercase. A
# typo'd id (e.g. `["SEC0001"]`) is rejected at config load with
# the rule catalog in the error message.
disable = []
# Severity that triggers a nonzero exit code: "error" | "warning" | "info".
fail_on = "warning"

[diff]
# Default classification at or above which `pgrls diff` exits 1.
# Values: "safe" | "breaking" | "requires-review" | "dangerous".
# `dangerous` (the default) gates CI on actual security regressions
# only; `requires-review` is the strict-review setting that also
# fails on auto-classifier-uncertain changes (column references,
# disjoint role replacements, unrecognized AST patterns). Override
# per-invocation with `--fail-on`.
fail_on = "dangerous"

# Per-rule options. Each rule reads its own table. Section names
# are case-insensitive (`[lint.rules.sec001]` is equivalent to
# `[lint.rules.SEC001]`), and a typo'd section is rejected at
# config load with the rule catalog in the error.

[lint.rules.SEC001]
# Tables where missing RLS is acceptable. Entries can be unqualified
# (countries) or qualified (tenant.things). Partitioned tables:
# SEC001 walks the `PARTITION OF` chain and suppresses the violation
# on a child whose ancestor has RLS enabled. When the chain leaves
# the scanned schemas before pgrls can verify coverage, the rule
# fires with a different message asking the user to widen
# `database.schemas`. When the chain reaches a visible RLS-less
# root, the rule names the root in its message so the fix lands at
# the right level.
allowlist = []

[lint.rules.SEC002]
# Tables where ENABLE without FORCE is acceptable. Same shape as SEC001.
allowlist = []

[lint.rules.SEC003]
# Policies allowed to be permissive-and-PUBLIC. Entries are fully-qualified
# policy IDs of the form "schema.table.policy_name".
allowlist = []

[lint.rules.SEC004]
# Functions whose `IS NULL` in a top-level OR disjunct triggers SEC004.
# Defaults: auth.uid, auth.role, auth.jwt, current_user, session_user,
# current_setting. Override with a list to add or replace.
# auth_functions = ["auth.uid", "current_setting", "my.custom_auth"]

[lint.rules.SEC005]
# Policies whose expression legitimately has no own-column reference
# (e.g. an admin-only audit log). Entries are fully-qualified policy IDs
# of the form "schema.table.policy_name".
allowlist = []

[lint.rules.SEC006]
# Policies allowed to omit WITH CHECK on INSERT/UPDATE/ALL. Entries are
# fully-qualified policy IDs.
allowlist = []

[lint.rules.SEC007]
# Tables where every-policy-permissive is intentional (e.g. reference
# data). Entries are qualified table IDs of the form "schema.table".
allowlist = []

[lint.rules.SEC008]
# Policies allowed to keep `USING (true)`. Entries are fully-qualified
# policy IDs.
allowlist = []

[lint.rules.SEC009]
# Tables where deny-all (RLS enabled, no policies) is intentional —
# e.g., a soft-deleted tombstone or a superuser-only audit log.
# Entries can be unqualified (audit_events) or qualified
# (private.audit_events). Same shape as SEC001 / SEC002.
allowlist = []

[lint.rules.SEC010]
# Policies allowed to keep `USING (false)`. Rare but legal — usually
# a temporary block coordinated with a feature flag. The right
# primitive for permanent denial is REVOKE at the GRANT layer.
# Entries are fully-qualified policy IDs.
allowlist = []

[lint.rules.SEC011]
# Policies allowed to keep an `OR true` branch. Almost always a
# leftover debug branch — reach for this only when the policy
# really is supposed to admit every row. Entries are fully-
# qualified policy IDs.
allowlist = []

[lint.rules.SEC012]
# Tables allowed to have only RESTRICTIVE policies (silent deny-all).
# Postgres needs at least one PERMISSIVE policy to grant access; this
# rule's default behavior is to flag tables that are RLS-on with
# only-RESTRICTIVE policies as silently denying every row. Allowlist
# the rare cases where deny-all is intentional — e.g., a "shadow"
# table queried only via SECURITY DEFINER functions, never directly.
# Entries can be unqualified ("shadow_audit") or qualified
# ("public.shadow_audit").
allowlist = []

[lint.rules.SEC013]
# Triggers allowed on RLS-protected tables. Triggers fire as the
# table OWNER, so any SELECT / INSERT / UPDATE / DELETE inside the
# function body bypasses the invoking role's RLS policies. The rule
# warns on every user-authored, enabled trigger on an RLS-enabled
# table; allowlist after auditing the function body for cross-
# tenant reads, writes the caller couldn't issue directly, and
# owner-visible data echoed back through derived columns or RAISE
# messages. Entries are fully-qualified trigger IDs of the form
# "schema.table.trigger_name". Bare trigger names are rejected
# because Postgres scopes trigger names per table — two tables can
# carry identically-named triggers and a name-only allowlist would
# silence both.
#
# Note: the key is the trigger ID, not the function being called.
# If two tables both route to an audited `audit.log_change`
# function, you need both trigger IDs in the list — the rule
# treats each trigger independently because the leak surface is
# the trigger + table pair, not the function alone (the same
# function can be safe on table X and leaky on table Y if Y has
# a wider tenant_id column or different ownership).
allowlist = []

[lint.rules.SEC014]
# Free-standing SECURITY DEFINER function audit. Every SECDEF
# function in the introspected schemas is flagged — the rule
# surfaces the full SECDEF surface so each function gets an
# explicit audit decision (rewrite as INVOKER, or documented
# allowlist). SEC013 covers the trigger-mediated bypass path;
# VIEW004 covers the view-mediated bypass path; SEC014 closes
# the gap for SECDEF functions called directly from
# application code (`SELECT my_secdef(...)`, JDBC, ORM
# bindings). Entries are fully-qualified function names of
# the form "schema.function". Bare function names are
# rejected because two same-named functions in different
# schemas would otherwise both be silenced.
#
# Note: argument signatures are NOT part of the allowlist
# shape. A function with two overloads (e.g. `do_thing(int)`
# vs `do_thing(text)`) is flagged once and allowlisted once.
# Operators needing per-overload granularity should
# `ALTER FUNCTION` one of them to a different name.
allowlist = []

[lint.rules.SEC015]
# SECURITY DEFINER `pg_temp` search-path shadowing. A SECDEF
# function whose effective search_path lets pg_temp (the
# per-session temp schema, writable by every connected role) be
# searched before the legitimate schemas is exploitable: an attacker
# shadows an unqualified object reference with a same-named
# pg_temp object and the function runs attacker SQL as its
# owner (the CVE-2018-1058 privesc class). The rule fires
# unless the function pins `search_path` with `pg_temp` named
# explicitly LAST — the only shape that forces the temp schema
# to be searched last. Fix: `ALTER FUNCTION name(args) SET
# search_path = <existing>, pg_temp`.
#
# Allowlist after confirming the function body fully-qualifies
# every object reference (in which case search_path is moot).
# Entries are fully-qualified function names of the form
# "schema.function"; bare names are rejected (cross-schema
# collision). SEC015 is the sharp companion to SEC014 — a
# function flagged by both is the common case; allowlist it
# here after the search_path fix, clear the SEC014 finding
# separately.
allowlist = []

[lint.rules.SEC016]
# Roles carrying the BYPASSRLS attribute. A role with BYPASSRLS
# skips every row-level security policy on every table — RLS is
# effectively off for it, unconditionally and cluster-wide. The
# rule flags every non-superuser BYPASSRLS role (a superuser
# bypasses RLS regardless, so the attribute is redundant noise
# on one and SEC016 skips it). Fix: `ALTER ROLE name
# NOBYPASSRLS`.
#
# Allowlist after confirming the role genuinely needs to bypass
# RLS — typically only backup, logical-replication, or ETL
# roles do. Entries are bare role names: Postgres roles are
# cluster-global and have no schema component, so — unlike the
# function/view/policy rules — there is nothing to qualify.
allowlist = []

[lint.rules.SEC017]
# Functions carrying the LEAKPROOF attribute. A LEAKPROOF
# function promises the planner it has no side channels, so the
# planner may evaluate it below a security barrier — ahead of a
# table's row-level security qual, ahead of a security_barrier
# view's WHERE. A function wrongly marked LEAKPROOF then runs on
# rows the caller can't see; an error it raises (or its timing)
# leaks those rows. Marking LEAKPROOF requires superuser, so the
# rule flags every such function for an explicit audit. Fix:
# `ALTER FUNCTION name(argtypes) NOT LEAKPROOF`.
#
# Allowlist after confirming no error path and no timing channel
# exposes an argument. Entries are fully-qualified function names
# of the form "schema.function"; bare names are rejected
# (cross-schema collision). Overloads collapse — one entry covers
# every overload of a qualified name.
allowlist = []

[lint.rules.SEC018]
# Policies that key off current_user / session_user. These name
# the Postgres role the session runs as — they isolate tenants
# only when each tenant connects as a distinct role. Pooled
# application code shares one role, so current_user becomes a
# constant and the policy stops isolating anything. Fix: key the
# policy off a per-request session value instead —
# current_setting('app.tenant_id') or a JWT claim.
#
# Allowlist only if this project genuinely uses the
# role-per-tenant pattern (one Postgres role per tenant, SET ROLE
# per request), where current_user IS the correct discriminator.
# Entries are fully-qualified policy IDs of the form
# "schema.table.policy_name".
allowlist = []

[lint.rules.PERF001]
# Policies allowed to call an auth function unwrapped in USING. Reach
# for this sparingly — the rewrite to `(SELECT auth.uid())` is
# mechanical and always safe (and `pgrls fix --rule PERF001` does
# it for you). Entries are fully-qualified policy IDs.
allowlist = []
# Functions whose unwrapped call in USING triggers PERF001. Defaults:
# auth.uid, auth.role, auth.jwt, current_setting. Override REPLACES
# the default — list every function you want covered.
# auth_functions = ["auth.uid", "current_setting", "my.current_user_id"]

[lint.rules.PERF002]
# Policies allowed to call a VOLATILE function in their predicate.
# Rare — VOLATILE in a policy is almost always a bug (predicate
# truth varies between calls, often a security hazard). Entries
# are fully-qualified policy IDs.
allowlist = []
# Functions considered VOLATILE for the purposes of this rule.
# Defaults: random, clock_timestamp, nextval, gen_random_uuid,
# pg_backend_pid. Override REPLACES the default.
# volatile_functions = ["random", "clock_timestamp", "my.volatile"]

[lint.rules.PERF003]
# Policies whose predicate columns are allowed to remain un-indexed.
# Postgres evaluates a policy's USING / WITH CHECK clause per row, so
# without an index on the filtering column the planner does a
# sequential scan — fine for small tables, catastrophic on multi-
# tenant tables with millions of rows. Allowlist when:
#   * an expression index exists that pgrls's v0.5.10 introspection
#     doesn't decode (`CREATE INDEX ON tbl (lower(email))`);
#   * the table is intentionally small and sequential scan is fine;
#   * the column is part of a composite predicate where the OTHER
#     column carries the leading-column index.
# Entries are fully-qualified policy IDs.
allowlist = []

[lint.rules.HYG002]
# Policy IDs allowed to keep placeholder names. Entries are fully-
# qualified policy IDs.
allowlist = []
# Words that mark a policy name as a placeholder. Defaults: todo,
# fixme, tmp, hack, xxx, debug, placeholder. The default list
# deliberately excludes `temp`, `draft`, `wip` — they collide
# with real domain words (temperature sensors, CMS draft state,
# WIP inventory). Opt back into the broader scaffolding-detection
# set by listing them explicitly below. Match is case-insensitive
# and respects identifier-token boundaries (snake_case,
# camelCase, SCREAMING_SNAKE). Setting this to an empty list
# disables the rule entirely (no placeholder words to match
# against). The override REPLACES the default list.
# placeholder_words = ["todo", "fixme", "scratch"]
