# pgrls config for the demo. Use case 02 demonstrates the allowlist
# mechanism: `app.countries` is reference data and is exempt from
# SEC001 by qualified name. Note `database.schemas = ["app"]` —
# the `private` schema in use case 14 is intentionally excluded so
# SEC001 emits its "leaves the scanned schemas" message on
# `app.audit_log_2026`.

[database]
url = "$DATABASE_URL"
schemas = ["app"]

[lint]
# Show every violation but only exit nonzero on errors. Lets the
# demo run end-to-end while still flagging anything that would
# block CI.
fail_on = "error"
# Disable PERF003 globally for the demo. The 50+ demo fixtures
# focus on the SEC* / HYG* / VIEW* / SEC013 / PERF001-PERF002
# catalog; adding a B-tree index per filter column on each fixture
# would triple the SQL volume and obscure the rule each case is
# built to demonstrate. Per-case tests only assert the rule(s) the
# case targets, so silencing PERF003 here is the right scoping.
# Real production schemas should KEEP PERF003 enabled — it catches
# a load-bearing perf bug that's invisible until traffic hits.
disable = ["PERF003"]

[lint.rules.SEC001]
# `app.countries` is world-readable reference data by design.
allowlist = ["app.countries"]

# Issue #11 fully closed in v0.5.7 — every demo fixture that used
# RESTRICTIVE-only has been rewritten to the canonical
# PERMISSIVE+RESTRICTIVE pattern, so the SEC012 allowlist is no
# longer needed. The chip-away history is preserved in the release
# notes (v0.3.1, v0.5.4–v0.5.7).
