# pgrls config for the demo. Use case 02 demonstrates the allowlist
# mechanism: `app.countries` is reference data and is exempt from
# SEC001 by qualified name. Note `database.schemas = ["app"]` —
# the `private` schema in use case 14 is intentionally excluded so
# SEC001 emits its "leaves the scanned schemas" message on
# `app.audit_log_2026`.

[database]
url = "$DATABASE_URL"
schemas = ["app"]

[lint]
# Show every violation but only exit nonzero on errors. Lets the
# demo run end-to-end while still flagging anything that would
# block CI.
fail_on = "error"

[lint.rules.SEC001]
# `app.countries` is world-readable reference data by design.
allowlist = ["app.countries"]

[lint.rules.SEC012]
# The demo's case fixtures predate SEC012 and were written when the
# demo author (and Postgres docs reader) believed RESTRICTIVE-only
# was a valid pattern. SEC012 is correct: a RESTRICTIVE-only table
# is silently deny-all. The demo's RESTRICTIVE-only tables are
# preserved as-is to keep the case-vs-rule scenarios stable and
# their violation counts unchanged; treating each as "deny-all by
# design for demo purposes" via this allowlist isolates the new
# rule's noise from the existing demo cases. A follow-up release
# may rewrite the affected cases to use a proper PERMISSIVE +
# RESTRICTIVE pattern; until then the allowlist stops SEC012 from
# tripping the "no rule fires on this clean case" tests.
allowlist = [
    "app.MixedCase Table",
    "app.admin_audit",
    "app.admin_overrides",
    "app.always_open",
    "app.array_tags",
    "app.audit_inserts",
    "app.booltest_orphan",
    "app.case_policy",
    "app.coalesce_auth",
    "app.comments",
    "app.composite_tenant",
    "app.current_user_check",
    "app.deep_events",
    "app.deny_via_false",
    # Issue #11 chip-away log:
    #   v0.3.1 — `app.documents` (uc01) → canonical PERMISSIVE+RESTRICTIVE.
    #   v0.5.4 — uc04 notes, uc06 accounts, uc07 singletons,
    #            uc08 invoices, uc11 messages, uc18 users_v2,
    #            uc19 profiles, uc20 todos, uc22 posts_v2.
    # Remaining entries below are the next chip-away targets.
    "app.ec_order_items",
    "app.ec_orders",
    "app.events",
    "app.feature_flags",
    "app.flags_table",
    "app.gdpr_records",
    "app.gen_cols",
    "app.json_access",
    "app.jwt_documents",
    "app.jwt_unwrapped",
    "app.kb_articles",
    "app.leaf_metrics_2026",
    "app.nested_or_check",
    "app.not_false_table",
    "app.or_true_table",
    "app.partial_orphan",
    "app.placeholder_named",
    "app.recent_only",
    "app.region_metrics",
    "app.row_comparison",
    "app.team_documents",
    "app.team_members",
    "app.tickets",
    "app.todos_archive",
    "app.typecast_auth",
    "app.typecast_email",
    "app.uc81_invoices",
    "app.uc83_invoices",
    "app.uc85_users",
    "app.uc86_users",
    "app.uc87_users",
    "app.uc88_users",
    "app.user_workspaces",
    "app.volatile_predicate",
]
