# pgrls config for the demo. Use case 02 demonstrates the allowlist
# mechanism: `app.countries` is reference data and is exempt from
# SEC001 by qualified name. Note `database.schemas = ["app"]` —
# the `private` schema in use case 14 is intentionally excluded so
# SEC001 emits its "leaves the scanned schemas" message on
# `app.audit_log_2026`.

[database]
url = "$DATABASE_URL"
schemas = ["app"]

[lint]
# Show every violation but only exit nonzero on errors. Lets the
# demo run end-to-end while still flagging anything that would
# block CI.
fail_on = "error"
# Disable PERF003 globally for the demo. The 50+ demo fixtures
# focus on the SEC* / HYG* / VIEW* / SEC013 / PERF001-PERF002
# catalog; adding a B-tree index per filter column on each fixture
# would triple the SQL volume and obscure the rule each case is
# built to demonstrate. Per-case tests only assert the rule(s) the
# case targets, so silencing PERF003 here is the right scoping.
# Real production schemas should KEEP PERF003 enabled — it catches
# a load-bearing perf bug that's invisible until traffic hits.
disable = ["PERF003"]

[lint.rules.SEC001]
# `app.countries` is world-readable reference data by design.
allowlist = ["app.countries"]

[lint.rules.SEC022]
# `app.gen_cols` (use case 46) is intentionally read-only — its
# policies are FOR SELECT only because they key off a GENERATED
# column, and that case demonstrates generated-column handling,
# not write coverage. Allowlist it so SEC022's read-only-table
# nudge does not confound uc46. SEC022 itself is shown firing on
# `app.read_replica` (use case 50).
allowlist = ["app.gen_cols"]

[lint.rules.SEC027]
# `app.gen_cols` (use case 46) scopes by `user_id_norm`, a GENERATED
# column derived from `user_id` (lower(user_id)). The table is
# per-user isolated, but the scoping goes through the normalized
# column, so SEC027 sees the raw `user_id` as unreferenced and
# nudges. This is exactly the false-positive shape SEC027's message
# tells operators to allowlist — the table is intentionally scoped,
# pgrls just can't see through the generated-column derivation.
allowlist = ["app.gen_cols"]

[lint.rules.SEC030]
# Two demo tables intentionally scope by a nullable discriminator.
# `app.kb_articles` (use case 29) is a public-or-tenant mix: public
# rows (`is_public = true`) legitimately carry a NULL tenant_id and the
# `is_public OR tenant_id = ...` predicate admits them, so the nullable
# discriminator is by design. `app.gen_cols` (use case 46) scopes by
# the GENERATED column `user_id_norm`; the table is intentionally
# per-user scoped. Both are the documented "intentional nullable
# discriminator" allowlist case SEC030's message points to.
allowlist = ["app.kb_articles", "app.gen_cols"]

# Issue #11 fully closed in v0.5.7 — every demo fixture that used
# RESTRICTIVE-only has been rewritten to the canonical
# PERMISSIVE+RESTRICTIVE pattern, so the SEC012 allowlist is no
# longer needed. The chip-away history is preserved in the release
# notes (v0.3.1, v0.5.4–v0.5.7).
