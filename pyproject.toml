[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "pgrls"
version = "0.29.0"
description = "Static analyzer for Postgres Row-Level Security — 55 lint rules for tenant and per-user row-scoping bugs, performance traps, and hygiene (17 auto-fixable); a Z3 tenant-isolation prover (pgrls verify) that proves no row leaks to an anonymous session or across tenants, or shows the leaking row; gold-standard RLS scaffolding (pgrls generate); runtime seq-scan analysis (pgrls perf); a semantic policy-diff command for CI gating; and a pytest plugin for RLS isolation tests."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Dmitry Maranik" }]
keywords = ["postgres", "postgresql", "rls", "row-level-security", "linter", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.2",
    "psycopg[binary]>=3.1",
    "pglast>=6,<7",
    # z3-solver ships precompiled wheels (fast, no C++ toolchain) and
    # powers the semantic verifier path — `pgrls diff` predicate analysis
    # (the concrete leaking-row counterexample) and the SEC038
    # anonymous-read proof. Promoted from the optional `diff-z3` extra to a
    # core dependency so those features run on a plain `pip install pgrls`
    # instead of silently no-op'ing. It's one wheel with no transitive
    # bloat — far lighter than the docker/testcontainers `diff-apply`
    # extra, which stays optional.
    "z3-solver>=4.13",
]

[project.optional-dependencies]
# `pgrls.testing` registers a pytest11 entrypoint at the wheel level
# but pytest itself is not in the runtime deps — keeping `pgrls`
# slim for the lint-only path. Users who want the testing toolkit
# install with `pip install pgrls[testing]`.
testing = ["pytest>=8.0"]
# `z3-solver` is a CORE dependency as of 0.16.0 (see the comment in
# `dependencies` above), so the Z3 predicate analysis + SEC038 run on a
# plain `pip install pgrls`. This extra is retained as a no-op alias so
# the documented `pip install pgrls[diff-z3]` keeps working for anyone
# who pinned it; it adds nothing beyond the core dependency.
diff-z3 = ["z3-solver>=4.13"]
# Optional `--apply migration.sql` support for `pgrls diff`. Pulls
# in testcontainers so the diff can spin up an ephemeral Postgres,
# restore the captured baseline via Schema.to_sql(), apply the
# migration, and introspect the result for the head schema.
# Without this extra, --apply raises a clear "install
# pgrls[diff-apply]" error. Default install stays slim —
# testcontainers pulls in Docker / Selenium / lots of test
# infrastructure that lint / fix users don't need.
diff-apply = ["testcontainers[postgres]>=4.0"]
# `pgrls lint --migrations` builds a schema by applying migration files in
# a throwaway Postgres (pgrls.ephemeral). Same
# testcontainers dependency as diff-apply; aliased so the feature's install
# hint reads `pip install pgrls[ephemeral]`.
ephemeral = ["testcontainers[postgres]>=4.0"]
# `hatchling` is the build backend (declared in [build-system]) and
# is installed automatically by `python -m build` / pip's PEP 517
# isolated env. Don't list it here — including it would suggest to
# contributors that hatchling is needed for daily development.
dev = [
    "pytest>=8.0",
    "testcontainers[postgres]>=4.0",
    "build>=1.0",
    "twine>=5.0",
    # Property-based testing for AST resolvers (tests/test_property_*.py).
    # Not in the runtime / testing extras — it's a contributor tool, not
    # something downstream users of `pgrls.testing` need.
    "hypothesis>=6.0",
    # Lint + type gates. Run in CI by the `lint` job in test.yml and
    # locally via `uv run ruff check src/ tests/` / `uv run mypy
    # src/pgrls` — previously these gates ran only on contributors'
    # machines, never in CI (a linter that didn't lint itself).
    "ruff>=0.15",
    "mypy>=2.0",
]

[project.scripts]
pgrls = "pgrls.cli:main"

[project.entry-points.pytest11]
pgrls = "pgrls.testing.pytest_plugin"

[project.urls]
Homepage = "https://github.com/pgrls/pgrls"
Repository = "https://github.com/pgrls/pgrls"
Issues = "https://github.com/pgrls/pgrls/issues"
Changelog = "https://github.com/pgrls/pgrls/blob/main/CHANGELOG.md"
Documentation = "https://github.com/pgrls/pgrls#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/pgrls"]

[tool.hatch.build.targets.sdist]
# Don't ship `uv.lock` in the sdist. The lock file is a developer
# convenience — committing it for reproducible local environments
# is fine, but baking it into the published artifact misleads
# downstream packagers about which transitive versions are
# "supported." Same convention as pyproject + Poetry projects:
# lock for dev, install via dependency ranges in production.
exclude = ["uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.mypy]
python_version = "3.11"
strict = true

# pglast (the Postgres SQL parser pgrls uses for AST-based rules
# and the diff predicate matcher) doesn't ship `py.typed` in the
# v6.x range we pin, so mypy --strict reports `[import-untyped]`
# for every `from pglast import …` line. Silence at the
# import-resolver level so real type errors elsewhere stay loud,
# without sprinkling per-import `# type: ignore` comments.
[[tool.mypy.overrides]]
module = ["pglast", "pglast.*"]
ignore_missing_imports = true

# `z3-solver` (the Python wrapper around Z3) doesn't ship type
# stubs as of 4.13. Suppress at the import-resolver level so the
# optional Phase 1 Z3 predicate path doesn't sprinkle per-call
# `# type: ignore` comments. Real type errors elsewhere stay loud.
[[tool.mypy.overrides]]
module = ["z3", "z3.*"]
ignore_missing_imports = true

# `testcontainers` (used for the `--apply` flow's ephemeral
# Postgres) doesn't ship type stubs as of 4.x. Suppress at the
# import-resolver level so the optional Phase 2 path doesn't need
# per-call `# type: ignore` comments. Real type errors elsewhere
# stay loud.
[[tool.mypy.overrides]]
module = ["testcontainers", "testcontainers.*"]
ignore_missing_imports = true

# `docker` SDK (transitive via testcontainers) similarly has no
# stubs. Used by the v0.5.2 baseline cache module to look up and
# commit cached images. Same rationale: optional path, suppress
# at the resolver level rather than peppering `# type: ignore`.
[[tool.mypy.overrides]]
module = ["docker", "docker.*"]
ignore_missing_imports = true
