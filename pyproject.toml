[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "pgrls"
version = "0.0.7"
description = "Framework-agnostic linter and testing toolkit for Postgres Row-Level Security."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Dmitry Maranik" }]
keywords = ["postgres", "postgresql", "rls", "row-level-security", "linter", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.2",
    "psycopg[binary]>=3.1",
    "pglast>=6,<7",
]

[project.optional-dependencies]
# `hatchling` is the build backend (declared in [build-system]) and
# is installed automatically by `python -m build` / pip's PEP 517
# isolated env. Don't list it here — including it would suggest to
# contributors that hatchling is needed for daily development.
dev = [
    "pytest>=8.0",
    "testcontainers[postgres]>=4.0",
    "build>=1.0",
    "twine>=5.0",
]

[project.scripts]
pgrls = "pgrls.cli:main"

[project.urls]
Homepage = "https://github.com/pgrls/pgrls"
Repository = "https://github.com/pgrls/pgrls"
Issues = "https://github.com/pgrls/pgrls/issues"
Changelog = "https://github.com/pgrls/pgrls/blob/main/CHANGELOG.md"
Documentation = "https://github.com/pgrls/pgrls#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/pgrls"]

[tool.hatch.build.targets.sdist]
# Don't ship `uv.lock` in the sdist. The lock file is a developer
# convenience — committing it for reproducible local environments
# is fine, but baking it into the published artifact misleads
# downstream packagers about which transitive versions are
# "supported." Same convention as pyproject + Poetry projects:
# lock for dev, install via dependency ranges in production.
exclude = ["uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
